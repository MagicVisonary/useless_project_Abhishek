.<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mango Survivor</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #87CEEB;
            text-align: center;
        }

        h1 {
            font-size: 40px;
            margin-bottom: 5px;
        }

        #subtitle {
            font-size: 20px;
        }

        #game {
            width: 90%;
            max-width: 900px;
            height: 550px;
            margin: 20px auto;
            background: #90EE90;
            border: 6px solid #654321;
            border-radius: 15px;
            position: relative;
            overflow: hidden;
        }

        #tree {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 100px;
        }

        #mango {
            position: absolute;
            font-size: 45px;
            top: 120px;
            left: 50%;
            transform: translateX(-50%);
        }

        #bucket {
            position: absolute;
            font-size: 60px;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
        }

        #info {
            display: flex;
            justify-content: center;
            gap: 50px;
            font-size: 22px;
            font-weight: bold;
        }

        #message {
            font-size: 25px;
            font-weight: bold;
            min-height: 35px;
        }

        button {
            font-size: 25px;
            padding: 10px 30px;
            margin: 5px;
            cursor: pointer;
            border-radius: 10px;
            border: 2px solid #333;
        }

        #restart {
            display: none;
        }

    </style>

</head>

<body>

    <h1>🥭 MANGO SURVIVOR</h1>

    <div id="subtitle">
        Catch a mango and you're ELIMINATED.
    </div>

    <div id="info">

        <div>
            Time: <span id="timer">30</span>
        </div>

        <div>
            Status: <span id="status">READY</span>
        </div>

    </div>

    <div id="game">

        <div id="tree">
            🌳
        </div>

        <div id="mango">
            🥭
        </div>

        <div id="bucket">
            🪣
        </div>

    </div>

    <div id="message">
        Don't catch the mango!
    </div>

    <div>

        <button onclick="moveLeft()">
            ⬅️
        </button>

        <button onclick="moveRight()">
            ➡️
        </button>

    </div>

    <button id="start" onclick="startGame()">
        START GAME
    </button>

    <button id="restart" onclick="startGame()">
        PLAY AGAIN
    </button>


    <script>

        let bucketPosition = 50;

        let mangoX = 5;
        let mangoY = 12;

        let gameRunning = false;

        let timeLeft = 30;

        let gameTimer;
        let mangoTimer;


        const bucket =
            document.getElementById("bucket");

        const mango =
            document.getElementById("mango");

        const timer =
            document.getElementById("timer");

        const status =
            document.getElementById("status");

        const message =
            document.getElementById("message");

        const startButton =
            document.getElementById("start");

        const restartButton =
            document.getElementById("restart");


        function startGame() {

            gameRunning = true;

            timeLeft = 30;

            bucketPosition = 50;

            mangoY = 120;

            moveBucket();

            status.innerText = "ALIVE";

            message.innerText =
                "Don't catch the mango!";

            startButton.style.display = "none";

            restartButton.style.display = "none";

            timer.innerText = timeLeft;

            spawnMango();


            mangoTimer =
                setInterval(moveMango, 30);


            gameTimer =
                setInterval(countdown, 1000);

        }


        function spawnMango() {

            mangoY = 120;

            mangoX =
                Math.random() * 90 + 5;

            mango.style.left =
                mangoX + "%";

            mango.style.top =
                mangoY + "px";

        }


        function moveMango() {

            if (!gameRunning) {
                return;
            }

            mangoY += 4;

            mango.style.top =
                mangoY + "px";

            checkCollision();


            if (mangoY > 520) {

                spawnMango();

                message.innerText =
                    "Excellent! You avoided it.";

            }

        }


        function checkCollision() {

            const mangoRect =
                mango.getBoundingClientRect();

            const bucketRect =
                bucket.getBoundingClientRect();


            if (
                mangoRect.left < bucketRect.right &&
                mangoRect.right > bucketRect.left &&
                mangoRect.top < bucketRect.bottom &&
                mangoRect.bottom > bucketRect.top
            ) {

                eliminate();

            }

        }


        function eliminate() {

            gameRunning = false;

            clearInterval(mangoTimer);

            clearInterval(gameTimer);

            status.innerText =
                "💀 ELIMINATED";

            message.innerText =
                "💀 YOU CAUGHT A MANGO. WHY?!";

            restartButton.style.display =
                "inline-block";

        }


        function countdown() {

            timeLeft--;

            timer.innerText =
                timeLeft;


            if (timeLeft <= 0) {

                gameRunning = false;

                clearInterval(mangoTimer);

                clearInterval(gameTimer);

                status.innerText =
                    "🏆 SURVIVED";

                message.innerText =
                    "🏆 You caught NOTHING. YOU WIN!";

                restartButton.style.display =
                    "inline-block";

            }

        }


        function moveLeft() {

            if (!gameRunning) {
                return;
            }

            bucketPosition -= 5;

            if (bucketPosition < 5) {
                bucketPosition = 5;
            }

            moveBucket();

        }


        function moveRight() {

            if (!gameRunning) {
                return;
            }

            bucketPosition += 5;

            if (bucketPosition > 95) {
                bucketPosition = 95;
            }

            moveBucket();

        }


        function moveBucket() {

            bucket.style.left =
                bucketPosition + "%";

        }


        document.addEventListener(
            "keydown",
            function(event) {

                if (event.key === "ArrowLeft") {
                    moveLeft();
                }

                if (event.key === "ArrowRight") {
                    moveRight();
                }

            }
        );

    </script>

</body>

</html>
